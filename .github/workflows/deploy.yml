name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Test and build web
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Flutter web for this repository
        run: >-
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=CMS=${{ vars.CMS }}
          --dart-define=CMS_URL=${{ vars.CMS_URL }}
          --dart-define=CMS_SPACE=${{ vars.CMS_SPACE }}
          --dart-define=CMS_PROJECT=${{ vars.CMS_PROJECT }}
          --dart-define=CMS_DATASET=${{ vars.CMS_DATASET }}
          --dart-define=CMS_TOKEN=${{ secrets.CMS_TOKEN }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
